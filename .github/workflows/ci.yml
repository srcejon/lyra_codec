name: CMake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            id: linux-x64
            os: ubuntu-24.04
          - name: macOS arm64
            id: macos-arm64
            os: macos-15
          - name: Windows x64
            id: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up OpenCV 4.14
        id: opencv
        uses: ./.github/actions/setup-opencv

      - name: Configure
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenCV_DIR="${{ steps.opencv.outputs.opencv-dir }}" \
            -DLYRA_CODEC_BUILD_TESTS=ON \
            -DLYRA_CODEC_BUILD_RUNTIME=ON \
            -DLYRA_CODEC_BUILD_TOOLS=ON

      - name: Configure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DOpenCV_DIR="${{ steps.opencv.outputs.opencv-dir }}" `
            -DLYRA_CODEC_BUILD_TESTS=ON `
            -DLYRA_CODEC_BUILD_RUNTIME=ON `
            -DLYRA_CODEC_BUILD_TOOLS=ON

      - name: Build and test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build build --parallel 2
          export LD_LIBRARY_PATH="${{ steps.opencv.outputs.runtime-dir }}:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="${{ steps.opencv.outputs.runtime-dir }}:${DYLD_LIBRARY_PATH:-}"
          ctest --test-dir build --output-on-failure
          cmake --install build \
            --prefix "$GITHUB_WORKSPACE/package/lyra-codec-${{ matrix.id }}"

      - name: Build and test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          $env:PATH = "${{ steps.opencv.outputs.runtime-dir }};$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release `
            --prefix "$env:GITHUB_WORKSPACE/package/lyra-codec-${{ matrix.id }}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: lyra-codec-${{ matrix.id }}
          path: package/lyra-codec-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up OpenCV 4.14 Android SDK
        id: opencv
        uses: ./.github/actions/setup-opencv
        with:
          target: android

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenCV_DIR="${{ steps.opencv.outputs.opencv-dir }}" \
            -DLYRA_CODEC_BUILD_TESTS=ON \
            -DLYRA_CODEC_BUILD_TOOLS=OFF
          cmake --build build-android --parallel 2
          cmake --install build-android \
            --prefix "$GITHUB_WORKSPACE/package/lyra-codec-android-arm64-v8a"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: lyra-codec-android-arm64-v8a
          path: package/lyra-codec-android-arm64-v8a
          if-no-files-found: error
          retention-days: 14
